<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: url(#subGrad);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .description {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Decorative Background Glow Spheres -->
  <circle cx="150" cy="50" r="120" fill="url(#glowGrad)" />
  <circle cx="780" cy="180" r="140" fill="#6366f1" fill-opacity="0.12" />

  <!-- Wave Flow Graphic at Bottom -->
  <path d="M0 195 C 200 170, 350 220, 550 190 C 720 165, 820 205, 900 185 L 900 240 L 0 240 Z" fill="url(#accentGrad)" fill-opacity="0.15" />
  <path d="M0 215 C 220 190, 420 230, 620 205 C 760 190, 840 225, 900 210 L 900 240 L 0 240 Z" fill="url(#accentGrad)" fill-opacity="0.25" />

  <!-- Content Group (Centered) -->
  <g transform="translate(450, 0)">
    <!-- Subtitle Category Tag -->
    <text class="subtitle" x="0" y="58" text-anchor="middle">SOFTWARE &amp; APPLIED AI SYSTEMS ENGINEER</text>

    <!-- Main Title -->
    <text class="title" x="0" y="112" text-anchor="middle" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
      Ved Prakash Meena
    </text>

    <!-- Focus Description -->
    <text class="description" x="0" y="148" text-anchor="middle">
      Computer Science Undergraduate @ Indian Institute of Information Technology (IIIT) Sonepat
    </text>

    <!-- Key Competencies Pills -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: Full-Stack Web -->
      <rect x="-260" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="badge-text" x="-202" y="17" text-anchor="middle">⚡ Full-Stack Web</text>

      <!-- Pill 2: Computer Vision -->
      <rect x="-135" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="badge-text" x="-72" y="17" text-anchor="middle">👁️ Computer Vision</text>

      <!-- Pill 3: LLM Alignment -->
      <rect x="0" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="badge-text" x="67" y="17" text-anchor="middle">🎯 LLM Alignment</text>

      <!-- Pill 4: Systems & Cloud -->
      <rect x="145" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="badge-text" x="205" y="17" text-anchor="middle">🚀 Scalable Systems</text>
    </g>
  </g>
</svg>
